<script>
        const canvas = document.getElementById('preview-canvas');
        const ctx = canvas.getContext('2d');
        const paramA = document.getElementById('param-a');
        const paramB = document.getElementById('param-b');
        const paramC = document.getElementById('param-c');
        const valA = document.getElementById('val-a');
        const valB = document.getElementById('val-b');
        const valC = document.getElementById('val-c');

        let width, height;
        let time = 0;

        function resize() {
            width = canvas.width = canvas.offsetWidth;
            height = canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 简易3D投影
        function project(x, y, z) {
            const scale = 400;
            const distance = 4;
            const factor = scale / (distance + z);
            return {
                x: x * factor + width / 2,
                y: -y * factor + height / 2
            };
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            time += 0.02;

            const a = parseFloat(paramA.value);
            const b = parseFloat(paramB.value);
            const c = parseFloat(paramC.value);
            
            valA.textContent = a.toFixed(2);
            valB.textContent = b.toFixed(2);
            valC.textContent = c.toFixed(2);

            const rows = 20;
            const cols = 20;
            const size = 3;

            ctx.strokeStyle = `rgba(0, 255, 136, 0.3)`;
            ctx.lineWidth = 1;

            // 绘制网格
            for (let i = -rows; i <= rows; i++) {
                ctx.beginPath();
                for (let j = -cols; j <= cols; j++) {
                    const x = j / 5;
                    const z = i / 5;
                    // 正弦波动公式
                    const y = a * Math.sin(b * Math.sqrt(x*x + z*z) - time * 2 + c);
                    
                    // 旋转变换
                    const rx = x * Math.cos(time*0.2) - z * Math.sin(time*0.2);
                    const rz = x * Math.sin(time*0.2) + z * Math.cos(time*0.2);
                    
                    const p = project(rx, y, rz);
                    if (j === -cols) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();
            }

            for (let j = -cols; j <= cols; j++) {
                ctx.beginPath();
                for (let i = -rows; i <= rows; i++) {
                    const x = j / 5;
                    const z = i / 5;
                    const y = a * Math.sin(b * Math.sqrt(x*x + z*z) - time * 2 + c);
                    
                    const rx = x * Math.cos(time*0.2) - z * Math.sin(time*0.2);
                    const rz = x * Math.sin(time*0.2) + z * Math.cos(time*0.2);
                    
                    const p = project(rx, y, rz);
                    if (i === -rows) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
