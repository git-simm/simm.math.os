<script>
        // 粒子背景动画
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 2;
                this.color = `rgba(${Math.random() * 100 + 100}, ${Math.random() * 200 + 55}, 255, ${Math.random() * 0.5 + 0.2})`;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (mouse.x && mouse.y) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) {
                        this.x += dx * 0.01;
                        this.y += dy * 0.01;
                    }
                }

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            resize();
            particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();

        // 名言切换逻辑
        const quotes = [
            { text: "“数学是上帝用来书写宇宙的语言。”", author: "伽利略" },
            { text: "“大自然这本书是用数学语言写成的。”", author: "伽利略" },
            { text: "“数学，如果正确地看它，不但拥有真理，而且也具有至高无上的美。”", author: "罗素" },
            { text: "“哪里有数学，哪里就有美。”", author: "普罗克洛斯" },
            { text: "“纯数学，就其本质而言，是逻辑思想的诗篇。”", author: "爱因斯坦" }
        ];
        let currentQuote = 0;
        const quoteText = document.getElementById('quote-text');
        const quoteAuthor = document.getElementById('quote-author');

        setInterval(() => {
            quoteText.style.opacity = 0;
            setTimeout(() => {
                currentQuote = (currentQuote + 1) % quotes.length;
                quoteText.textContent = quotes[currentQuote].text;
                quoteAuthor.textContent = `— ${quotes[currentQuote].author}`;
                quoteText.style.opacity = 1;
            }, 500);
        }, 5000);
    </script>
